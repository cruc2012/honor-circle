<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #020617;
            --panel: #0f172a;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border: #1e293b;
            --card-bg: #1e293b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --success-hover: #16a34a;
            --warning: #f59e0b;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        html.light {
            --bg: #f8fafc;
            --panel: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border: #e2e8f0;
            --card-bg: #f1f5f9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #16a34a;
            --success-hover: #15803d;
            --warning: #d97706;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        .login-required {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px var(--shadow);
        }

        .login-icon { font-size: 4rem; margin-bottom: 20px; }
        .login-btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 15px;
        }

        #app {
            min-height: 100vh;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent), #fbbf24);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--card-bg);
            border-color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            background: var(--panel);
            color: var(--text);
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        .tab-badge {
            background: var(--danger);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .table-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        td {
            padding: 15px;
            border-top: 1px solid var(--border);
        }

        tr:hover { background: var(--bg); }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 5px;
        }

        .btn-approve {
            background: var(--success);
            color: white;
        }

        .btn-approve:hover {
            background: var(--success-hover);
        }

        .btn-reject {
            background: var(--danger);
            color: white;
        }

        .btn-reject:hover {
            background: var(--danger-hover);
        }

        .btn-edit {
            background: var(--accent);
            color: white;
        }

        .btn-edit:hover {
            background: var(--accent-hover);
        }

        .btn-delete {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        .btn-view {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-view:hover {
            background: var(--card-bg);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .badge-approved {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .badge-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--card-bg);
            color: var(--text);
        }

        .modal-body { padding: 25px; }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            padding: 25px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-primary {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            padding: 12px 24px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: var(--card-bg);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            transform: translateY(100px);
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px var(--shadow);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }

        .access-denied {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .access-denied h1 {
            color: var(--danger);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .add-btn {
            padding: 12px 24px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .add-btn:hover {
            background: var(--success-hover);
            transform: translateY(-2px);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; text-align: center; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            th, td { padding: 10px; font-size: 0.9rem; }
            .action-btn { padding: 6px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <div class="toast" id="toast"></div>

    <!-- Teacher Modal -->
    <div class="modal-overlay" id="teacherModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add Teacher</h2>
                <button class="close-btn" onclick="closeModal()">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="teacherForm">
                    <input type="hidden" id="teacherId">
                    <div class="form-group">
                        <label for="teacherName">Teacher Name</label>
                        <input type="text" id="teacherName" required placeholder="e.g., Mr. Smith">
                    </div>
                    <div class="form-group">
                        <label for="teacherSubject">Subject</label>
                        <select id="teacherSubject" required>
                            <option value="">Select subject...</option>
                            <option value="math">Math</option>
                            <option value="reading">Reading</option>
                            <option value="science">Science</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveTeacher()">Save Teacher</button>
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Teacher Details</h2>
                <button class="close-btn" onclick="closeDetailsModal()">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="modal-body" id="detailsContent"></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://mdymxbgwhauapvphscrr.supabase.co",
            "sb_publishable_nOrq936I1SMh4v21KzE2og_tAEbcAzK"
        );

        function getCookie(name) {
            return document.cookie.split("; ").find(r => r.startsWith(name + "="))?.split("=")[1] || null;
        }

        function applyTheme() {
            if (getCookie("theme") === "light") {
                document.documentElement.classList.add("light");
            } else {
                document.documentElement.classList.remove("light");
            }
        }

        applyTheme();

        const uuid = getCookie("uuid");
        const content = document.getElementById("content");
        
        const ALLOWED_RANKS = ['owner', 'manager', 'admin'];
        
        let currentTab = 'requests';
        let teachers = [];
        let requests = [];

        if (!uuid) {
            content.innerHTML = `
                <div class="login-required">
                    <div class="login-card">
                        <div class="login-icon">🛡️</div>
                        <h1>Access Required</h1>
                        <p>Please log in to access the admin panel.</p>
                        <a href="/" class="login-btn">Sign In</a>
                    </div>
                </div>
            `;
        } else {
            init();
        }

        async function init() {
            try {
                const { data: userData, error: userError } = await supabase
                    .from("users")
                    .select("uuid, username, name, rank")
                    .eq("uuid", uuid)
                    .single();

                if (userError || !userData) {
                    content.innerHTML = `
                        <div class="login-required">
                            <div class="login-card">
                                <div class="login-icon">⚠️</div>
                                <h1>Session Expired</h1>
                                <a href="/" class="login-btn">Sign In</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                if (!ALLOWED_RANKS.includes(userData.rank.toLowerCase())) {
                    content.innerHTML = `
                        <div class="access-denied">
                            <div>
                                <h1>🚫 Access Denied</h1>
                                <p class="text-muted">Admin privileges required.</p>
                                <p class="text-muted mt-4">Your rank: <strong>${userData.rank}</strong></p>
                                <a href="teachers.html" class="login-btn mt-6">Back to Teachers</a>
                            </div>
                        </div>
                    `;
                    return;
                }

                content.innerHTML = `
                    <div id="app">
                        <div class="header">
                            <div>
                                <h1>🛡️ Teacher Admin Panel</h1>
                                <p style="color: var(--text-muted);">Manage teachers and requests</p>
                            </div>
                            <a href="teachers.html" class="back-btn">
                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                Back to Teachers
                            </a>
                        </div>

                        <div class="tabs">
                            <button class="tab active" onclick="switchTab('requests')" id="tab-requests">
                                <i data-lucide="inbox" class="w-5 h-5"></i>
                                Requests
                                <span class="tab-badge" id="requestCount">0</span>
                            </button>
                            <button class="tab" onclick="switchTab('teachers')" id="tab-teachers">
                                <i data-lucide="users" class="w-5 h-5"></i>
                                All Teachers
                            </button>
                            <button class="tab" onclick="switchTab('stats')" id="tab-stats">
                                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                                Statistics
                            </button>
                        </div>

                        <div class="tab-content active" id="content-requests">
                            <div class="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Requested By</th>
                                            <th>Teacher Name</th>
                                            <th>Subject</th>
                                            <th>Reason</th>
                                            <th>Date</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="requestsTable">
                                        <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="tab-content" id="content-teachers">
                            <button class="add-btn" onclick="openAddModal()">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                                Add New Teacher
                            </button>
                            <div class="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Subject</th>
                                            <th>Overall Rating</th>
                                            <th>Total Reviews</th>
                                            <th>Added</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="teachersTable">
                                        <tr><td colspan="6" style="text-align: center;">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="tab-content" id="content-stats">
                            <div class="stats-grid" id="statsGrid">
                                <div class="stat-card">
                                    <div class="stat-value" id="statTotalTeachers">-</div>
                                    <div class="stat-label">Total Teachers</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="statTotalReviews">-</div>
                                    <div class="stat-label">Total Reviews</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="statTotalRatings">-</div>
                                    <div class="stat-label">Total Ratings</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="statPendingRequests">-</div>
                                    <div class="stat-label">Pending Requests</div>
                                </div>
                            </div>
                            
                            <div class="table-container" style="margin-top: 30px;">
                                <h3 style="padding: 20px; border-bottom: 1px solid var(--border);">Top Rated Teachers</h3>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Rank</th>
                                            <th>Teacher</th>
                                            <th>Subject</th>
                                            <th>Overall Rating</th>
                                            <th>Nice</th>
                                            <th>Teaching</th>
                                            <th>Fun</th>
                                        </tr>
                                    </thead>
                                    <tbody id="topTeachersTable">
                                        <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                lucide.createIcons();
                await loadAllData();
                
            } catch (err) {
                console.error("Init error:", err);
                showToast("Error loading admin panel", "error");
            }
        }

        async function loadAllData() {
            await Promise.all([
                loadRequests(),
                loadTeachers(),
                loadStats()
            ]);
        }

        async function loadRequests() {
            try {
                const { data, error } = await supabase
                    .from("teacher_request")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) throw error;

                requests = data || [];
                const pendingCount = requests.filter(r => r.status === 'pending').length;
                
                document.getElementById("requestCount").textContent = pendingCount;
                
                const tbody = document.getElementById("requestsTable");
                
                if (requests.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <i data-lucide="inbox" class="w-16 h-16"></i>
                                    <p>No requests found</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    lucide.createIcons();
                    return;
                }

                tbody.innerHTML = requests.map(req => `
                    <tr>
                        <td>${req.user_uuid}</td>
                        <td><strong>${escapeHtml(req.teacher_name)}</strong></td>
                        <td>${capitalize(req.subject)}</td>
                        <td>${req.reason ? escapeHtml(req.reason) : '-'}</td>
                        <td>${new Date(req.created_at).toLocaleDateString()}</td>
                        <td><span class="badge badge-${req.status}">${req.status}</span></td>
                        <td>
                            ${req.status === 'pending' ? `
                                <button class="action-btn btn-approve" onclick="handleRequest('${req.id}', 'approve', this)">
                                    <i data-lucide="check" class="w-4 h-4"></i> Approve
                                </button>
                                <button class="action-btn btn-reject" onclick="handleRequest('${req.id}', 'reject', this)">
                                    <i data-lucide="x" class="w-4 h-4"></i> Reject
                                </button>
                            ` : '<span style="color: var(--text-muted);">Processed</span>'}
                        </td>
                    </tr>
                `).join('');

                lucide.createIcons();

            } catch (err) {
                console.error("Load requests error:", err);
                document.getElementById("requestsTable").innerHTML = `
                    <tr><td colspan="7" style="text-align: center; color: var(--danger);">Error loading requests</td></tr>
                `;
            }
        }

        async function loadTeachers() {
            try {
                const { data, error } = await supabase
                    .from("teachers")
                    .select(`
                        *,
                        ratings:teacher_ratings(nice_rating, teaching_rating, fun_rating),
                        reviews:teacher_reviews(count)
                    `)
                    .order("created_at", { ascending: false });

                if (error) throw error;

                teachers = (data || []).map(teacher => {
                    const ratings = teacher.ratings || [];
                    const avgNice = ratings.length ? (ratings.reduce((a, b) => a + (b.nice_rating || 0), 0) / ratings.length).toFixed(1) : "0.0";
                    const avgTeaching = ratings.length ? (ratings.reduce((a, b) => a + (b.teaching_rating || 0), 0) / ratings.length).toFixed(1) : "0.0";
                    const avgFun = ratings.length ? (ratings.reduce((a, b) => a + (b.fun_rating || 0), 0) / ratings.length).toFixed(1) : "0.0";
                    const overall = ratings.length ? ((parseFloat(avgNice) + parseFloat(avgTeaching) + parseFloat(avgFun)) / 3).toFixed(1) : "0.0";
                    
                    return {
                        ...teacher,
                        avgNice,
                        avgTeaching,
                        avgFun,
                        overall,
                        ratingCount: ratings.length,
                        reviewCount: teacher.reviews?.[0]?.count || 0
                    };
                });

                const tbody = document.getElementById("teachersTable");
                
                if (teachers.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6">
                                <div class="empty-state">
                                    <i data-lucide="users" class="w-16 h-16"></i>
                                    <p>No teachers found</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    lucide.createIcons();
                    return;
                }

                tbody.innerHTML = teachers.map(t => `
                    <tr>
                        <td><strong>${escapeHtml(t.name)}</strong></td>
                        <td>${capitalize(t.subject)}</td>
                        <td style="color: var(--accent); font-weight: 700;">${t.overall}</td>
                        <td>${t.reviewCount}</td>
                        <td>${new Date(t.created_at).toLocaleDateString()}</td>
                        <td>
                            <button class="action-btn btn-view" onclick="viewTeacherDetails('${t.id}')">
                                <i data-lucide="eye" class="w-4 h-4"></i> View
                            </button>
                            <button class="action-btn btn-edit" onclick="openEditModal('${t.id}')">
                                <i data-lucide="edit" class="w-4 h-4"></i> Edit
                            </button>
                            <button class="action-btn btn-delete" onclick="deleteTeacher('${t.id}')">
                                <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
                            </button>
                        </td>
                    </tr>
                `).join('');

                lucide.createIcons();

            } catch (err) {
                console.error("Load teachers error:", err);
                document.getElementById("teachersTable").innerHTML = `
                    <tr><td colspan="6" style="text-align: center; color: var(--danger);">Error loading teachers</td></tr>
                `;
            }
        }

        async function loadStats() {
            try {
                const { count: teacherCount } = await supabase
                    .from("teachers")
                    .select("*", { count: "exact", head: true });

                const { count: reviewCount } = await supabase
                    .from("teacher_reviews")
                    .select("*", { count: "exact", head: true });

                const { count: ratingCount } = await supabase
                    .from("teacher_ratings")
                    .select("*", { count: "exact", head: true });

                const { count: pendingCount } = await supabase
                    .from("teacher_request")
                    .select("*", { count: "exact", head: true })
                    .eq("status", "pending");

                document.getElementById("statTotalTeachers").textContent = teacherCount || 0;
                document.getElementById("statTotalReviews").textContent = reviewCount || 0;
                document.getElementById("statTotalRatings").textContent = ratingCount || 0;
                document.getElementById("statPendingRequests").textContent = pendingCount || 0;

                const sortedTeachers = [...teachers]
                    .filter(t => parseFloat(t.overall) > 0)
                    .sort((a, b) => parseFloat(b.overall) - parseFloat(a.overall))
                    .slice(0, 10);

                const topTbody = document.getElementById("topTeachersTable");
                
                if (sortedTeachers.length === 0) {
                    topTbody.innerHTML = `
                        <tr>
                            <td colspan="7">
                                <div class="empty-state" style="padding: 40px;">
                                    <p>No rated teachers yet</p>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                topTbody.innerHTML = sortedTeachers.map((t, index) => `
                    <tr>
                        <td style="font-weight: 700; color: ${index < 3 ? 'var(--accent)' : 'var(--text)'};">#${index + 1}</td>
                        <td><strong>${escapeHtml(t.name)}</strong></td>
                        <td>${capitalize(t.subject)}</td>
                        <td style="color: var(--accent); font-weight: 700;">${t.overall}</td>
                        <td>${t.avgNice}</td>
                        <td>${t.avgTeaching}</td>
                        <td>${t.avgFun}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("Load stats error:", err);
            }
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`content-${tab}`).classList.add('active');
            
            if (tab === 'requests') loadRequests();
            if (tab === 'teachers') loadTeachers();
            if (tab === 'stats') loadStats();
        };

        window.handleRequest = async function(requestId, action, btnElement) {
            // Prevent double-clicking
            if (btnElement.disabled) return;
            
            const originalContent = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = '<span class="loading-spinner"></span>';

            try {
                const request = requests.find(r => r.id === requestId);
                if (!request) {
                    throw new Error("Request not found");
                }

                if (action === 'approve') {
                    // First, add the teacher
                    const { data: newTeacher, error: teacherError } = await supabase
                        .from("teachers")
                        .insert({
                            name: request.teacher_name,
                            subject: request.subject,
                            created_at: new Date().toISOString()
                        })
                        .select()
                        .single();

                    if (teacherError) {
                        console.error("Teacher insert error:", teacherError);
                        throw new Error("Failed to create teacher: " + teacherError.message);
                    }

                    console.log("Teacher created:", newTeacher);
                }

                // Update request status
                const { error: updateError } = await supabase
                    .from("teacher_request")
                    .update({ 
                        status: action === 'approve' ? 'approved' : 'rejected',
                        updated_at: new Date().toISOString()
                    })
                    .eq("id", requestId);

                if (updateError) {
                    console.error("Status update error:", updateError);
                    throw new Error("Failed to update request status: " + updateError.message);
                }

                showToast(`Request ${action === 'approve' ? 'approved' : 'rejected'} successfully!`, "success");
                
                // Reload all data
                await Promise.all([
                    loadRequests(),
                    loadTeachers(),
                    loadStats()
                ]);

            } catch (err) {
                console.error("Handle request error:", err);
                showToast(err.message || "Failed to process request", "error");
                btnElement.disabled = false;
                btnElement.innerHTML = originalContent;
                lucide.createIcons();
            }
        };

        window.openAddModal = function() {
            document.getElementById("modalTitle").textContent = "Add Teacher";
            document.getElementById("teacherId").value = "";
            document.getElementById("teacherName").value = "";
            document.getElementById("teacherSubject").value = "";
            document.getElementById("teacherModal").classList.add("active");
        };

        window.openEditModal = function(teacherId) {
            const teacher = teachers.find(t => t.id === teacherId);
            if (!teacher) return;

            document.getElementById("modalTitle").textContent = "Edit Teacher";
            document.getElementById("teacherId").value = teacher.id;
            document.getElementById("teacherName").value = teacher.name;
            document.getElementById("teacherSubject").value = teacher.subject;
            document.getElementById("teacherModal").classList.add("active");
        };

        window.closeModal = function() {
            document.getElementById("teacherModal").classList.remove("active");
        };

        window.saveTeacher = async function() {
            const id = document.getElementById("teacherId").value;
            const name = document.getElementById("teacherName").value.trim();
            const subject = document.getElementById("teacherSubject").value;

            if (!name || !subject) {
                showToast("Please fill all fields", "error");
                return;
            }

            try {
                if (id) {
                    const { error } = await supabase
                        .from("teachers")
                        .update({ name, subject, updated_at: new Date().toISOString() })
                        .eq("id", id);

                    if (error) throw error;
                    showToast("Teacher updated successfully!", "success");
                } else {
                    const { error } = await supabase
                        .from("teachers")
                        .insert({ name, subject, created_at: new Date().toISOString() });

                    if (error) throw error;
                    showToast("Teacher added successfully!", "success");
                }

                closeModal();
                await loadTeachers();
                await loadStats();

            } catch (err) {
                console.error("Save teacher error:", err);
                showToast("Failed to save teacher: " + err.message, "error");
            }
        };

        window.deleteTeacher = async function(teacherId) {
            if (!confirm("Are you sure you want to delete this teacher? This will also delete all ratings and reviews.")) {
                return;
            }

            try {
                const { error } = await supabase
                    .from("teachers")
                    .delete()
                    .eq("id", teacherId);

                if (error) throw error;

                showToast("Teacher deleted successfully!", "success");
                await loadTeachers();
                await loadStats();

            } catch (err) {
                console.error("Delete teacher error:", err);
                showToast("Failed to delete teacher: " + err.message, "error");
            }
        };

        window.viewTeacherDetails = async function(teacherId) {
            const teacher = teachers.find(t => t.id === teacherId);
            if (!teacher) return;

            try {
                const { data: reviews, error } = await supabase
                    .from("teacher_reviews")
                    .select("*")
                    .eq("teacher_id", teacherId)
                    .order("created_at", { ascending: false });

                if (error) throw error;

                const content = document.getElementById("detailsContent");
                content.innerHTML = `
                    <div style="margin-bottom: 20px;">
                        <h3 style="font-size: 1.3rem; margin-bottom: 10px;">${escapeHtml(teacher.name)}</h3>
                        <p style="color: var(--text-muted);">${capitalize(teacher.subject)}</p>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;">
                        <div style="background: var(--bg); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);">${teacher.avgNice}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">Nice</div>
                        </div>
                        <div style="background: var(--bg); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);">${teacher.avgTeaching}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">Teaching</div>
                        </div>
                        <div style="background: var(--bg); padding: 15px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 1.5rem; font-weight: 700; color: var(--accent);">${teacher.avgFun}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">Fun</div>
                        </div>
                    </div>

                    <h4 style="margin-bottom: 15px; font-weight: 600;">Recent Reviews (${reviews?.length || 0})</h4>
                    ${reviews && reviews.length > 0 ? `
                        <div style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;">
                            ${reviews.map(r => `
                                <div style="background: var(--bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                        <span style="font-weight: 600; color: var(--accent);">${r.is_anonymous ? 'Anonymous' : '@' + r.username}</span>
                                        <span style="font-size: 0.85rem; color: var(--text-muted);">${new Date(r.created_at).toLocaleDateString()}</span>
                                    </div>
                                    <p style="color: var(--text-muted);">${escapeHtml(r.content)}</p>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p style="color: var(--text-muted);">No reviews yet</p>'}
                `;

                document.getElementById("detailsModal").classList.add("active");
                lucide.createIcons();

            } catch (err) {
                console.error("View details error:", err);
                showToast("Failed to load details", "error");
            }
        };

        window.closeDetailsModal = function() {
            document.getElementById("detailsModal").classList.remove("active");
        };

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type) {
            const toast = document.getElementById("toast");
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5" style="color: var(--${type === 'success' ? 'success' : 'danger'});"></i>
                <span>${message}</span>
            `;
            toast.className = `toast ${type}`;
            setTimeout(() => toast.classList.add("show"), 10);
            setTimeout(() => toast.classList.remove("show"), 3000);
            lucide.createIcons();
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        });
    </script>
</body>
</html>
